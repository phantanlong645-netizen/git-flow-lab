apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-flow-lab
  namespace: git-flow-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: git-flow-lab
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: git-flow-lab
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/phantanlong645-netizen/git-flow-lab:a8bc533defad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
